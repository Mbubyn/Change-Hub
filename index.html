<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Change Hub</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="sidebar-org-name">The Change Hub</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation" aria-expanded="true" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Populated by app.js -->
      </nav>
    </aside>

    <!-- Main content -->
    <main class="content-area" id="contentArea" tabindex="-1">
      <!-- Floating button to reopen sidebar when collapsed -->
      <button class="sidebar-open-btn" id="sidebarOpenBtn" aria-label="Open navigation" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <div class="content-pane" id="contentPane">
        <!-- Page content rendered here by router -->
        <div class="content-loading">Loading…</div>
      </div>
    </main>

  </div>

  <!-- Font: Poppins from bundled assets -->
  <style>
    @font-face {
      font-family: 'Poppins';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Poppins-Regular.woff') format('woff');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Poppins-SemiBold.woff') format('woff');
      font-weight: 600; font-style: normal;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Poppins-Bold.woff') format('woff');
      font-weight: 700; font-style: normal;
    }
    @font-face {
      font-family: 'Poppins';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Poppins-Italic.woff') format('woff');
      font-weight: 400; font-style: italic;
    }
    @font-face {
      font-family: 'Inter';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Inter-Regular.woff') format('woff');
      font-weight: 400; font-style: normal;
    }
    @font-face {
      font-family: 'Inter';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Inter-Medium.woff') format('woff');
      font-weight: 500; font-style: normal;
    }
    @font-face {
      font-family: 'Inter';
      src: url('the-change-hub-raw-XI9Ex8Dq/content/lib/fonts/Inter-Bold.woff') format('woff');
      font-weight: 700; font-style: normal;
    }
  </style>

  <script src="js/app.js"></script>
</body>
</html>
